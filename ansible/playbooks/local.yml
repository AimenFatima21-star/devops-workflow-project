---
- name: Local Setup for DevOps Workflow (No Sudo)
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    app_home: "{{ ansible_env.HOME }}/devops-workflow"
    app_user: "{{ ansible_env.USER }}"

  tasks:
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ app_home }}/app"
        - "{{ app_home }}/data"
        - "{{ app_home }}/logs"

    - name: Copy application code
      synchronize:
        src: "{{ playbook_dir }}/../../app/"
        dest: "{{ app_home }}/app/"
        delete: yes
      delegate_to: localhost

    - name: Check if Python is available
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Show Python version
      debug:
        msg: "Python version: {{ python_version.stdout }}"

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_home }}/app/requirements.txt"
        executable: pip3
      ignore_errors: yes

    - name: Run the application
      shell: |
        cd {{ app_home }}
        python3 app/sqlite_app.py > logs/app.log 2>&1 &
      args:
        executable: /bin/bash

    - name: Wait for app to start
      wait_for:
        port: 8080
        delay: 2
        timeout: 30

    - name: Display deployment summary
      debug:
        msg:
          - "✅ Deployment complete!"
          - "📂 App location: {{ app_home }}"
          - "📊 Database: {{ app_home }}/data/transactions.db"
          - "📝 Logs: {{ app_home }}/logs/app.log"
